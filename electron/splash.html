<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>影译工坊</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        color: #17202c;
        background: #f4f6f8;
        font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif;
      }
      main { display: flex; align-items: center; gap: 18px; }
      .mark {
        width: 56px;
        height: 56px;
        display: grid;
        place-items: center;
        border-radius: 8px;
        background: #1b2533;
        box-shadow: 0 12px 28px rgba(22, 31, 43, 0.16);
      }
      .frame {
        width: 30px;
        height: 24px;
        position: relative;
        border: 3px solid #58b781;
        border-radius: 4px;
      }
      .frame::after {
        content: "";
        position: absolute;
        left: 5px;
        right: 5px;
        bottom: 4px;
        height: 3px;
        border-radius: 2px;
        background: #e8edf3;
      }
      h1 { margin: 0 0 6px; font-size: 21px; font-weight: 700; }
      p { margin: 0; color: #647184; font-size: 13px; }
      .pulse { animation: pulse 1.3s ease-in-out infinite; }
      @keyframes pulse { 50% { opacity: 0.45; } }
      @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true"><span class="frame"></span></div>
      <div>
        <h1>影译工坊</h1>
        <p class="pulse">正在启动本地处理服务...</p>
      </div>
    </main>
  </body>
</html>
